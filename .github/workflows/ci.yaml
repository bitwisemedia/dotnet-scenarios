# CI — restore, build, and test the .NET solution.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  # check out the repository
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # read-only checkout; don't leave the token in .git/config

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Depot.slnx

      - name: Build
        run: dotnet build Depot.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Depot.slnx --no-build --configuration Release
